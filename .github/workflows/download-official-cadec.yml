name: Download official CADEC datasets

on:
  push:
    branches: [data/cadec-official-download]
    paths:
      - '.github/workflows/download-official-cadec.yml'
      - 'scripts/download_csiro_cadec.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/download-official-cadec.yml'
      - 'scripts/download_csiro_cadec.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader dependency
        run: python -m pip install requests
      - name: Download official CSIRO files
        id: download
        continue-on-error: true
        run: |
          python scripts/download_csiro_cadec.py --output-dir /tmp/cadec-official 2>&1 | tee /tmp/cadec-download.log
      - name: Inspect saved files and diagnostics
        if: always()
        run: |
          find /tmp/cadec-official -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort || true
          cat /tmp/cadec-official/download_summary.json || true
          tail -n 200 /tmp/cadec-download.log || true
      - name: Upload original files, metadata, listings and SHA-256 manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-cadec-and-cadecv2-diagnostics
          path: |
            /tmp/cadec-official
            /tmp/cadec-download.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce completed official download
        if: steps.download.outcome != 'success'
        run: exit 1
