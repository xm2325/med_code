name: Download official CADEC datasets

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/download-official-cadec.yml'
      - 'scripts/download_csiro_cadec.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader dependency
        run: python -m pip install requests
      - name: Download official CSIRO files
        run: |
          python scripts/download_csiro_cadec.py --output-dir /tmp/cadec-official
      - name: Inspect saved files
        run: |
          find /tmp/cadec-official -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort
          cat /tmp/cadec-official/download_summary.json
      - name: Upload original files, metadata and SHA-256 manifests
        uses: actions/upload-artifact@v4
        with:
          name: official-cadec-and-cadecv2
          path: /tmp/cadec-official
          if-no-files-found: error
          retention-days: 30
