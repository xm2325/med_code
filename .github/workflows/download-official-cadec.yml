name: Download official CADEC datasets

on:
  push:
    branches:
      - agent/download-official-cadec-data
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/download-official-cadec-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser downloader dependencies
        run: |
          python -m pip install requests playwright
          python -m playwright install --with-deps chromium
      - name: Download both official CSIRO DOI releases
        shell: bash
        run: |
          set -o pipefail
          python scripts/capture_csiro_cadec_playwright.py /tmp/official_cadec_datasets \
            2>&1 | tee /tmp/download.log
      - name: Show manifest
        if: always()
        run: |
          if [ -f /tmp/official_cadec_datasets/DOWNLOAD_MANIFEST.json ]; then
            cat /tmp/official_cadec_datasets/DOWNLOAD_MANIFEST.json
          fi
      - name: Upload official datasets and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-cadec-and-cadecv2
          path: |
            /tmp/official_cadec_datasets
            /tmp/download.log
          retention-days: 30
          if-no-files-found: error
